# Soubor se jmenuje blank.yml z dřívějška (původní GitHub starter workflow),
# ale už starter šablona neobsahuje — je to reálná kontrola dokumentace.
name: CI

# Kontrola běží na push a PR do mainu a lze ji spustit i ručně.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # markdownlint nad Markdownem v repu. Repo nemá package.json a nesmí vzniknout,
      # proto běží přes akci, ne přes npm install.
      # Pozn.: akce v20 má vstup `globs` (množné číslo), takže tady není `glob`.
      # Konfiguraci pravidel není potřeba přidávat jako krok — akce si ji automaticky
      # načte z .markdownlint-cli2.jsonc v kořeni repa.
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            docs/**/*.md
            templates/**/*.md
            README.md
            AGENTS.md

      # Kontrola, že v Markdownu nejsou mrtvé odkazy na jiné soubory repa.
      - name: Kontrola odkazů
        uses: lycheev/lychee-action@v2
        with:
          args: --no-progress './**/*.md' './README.md' './AGENTS.md'
          fail: true